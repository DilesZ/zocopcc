name: Refrescar precios

# Lee el catalogo de Zococity y las fichas de PCComponentes con Chrome real
# (nodriver), genera la instantanea y la publica. El push a main dispara el
# redespliegue automatico de Vercel (integracion Git), asi que no hace falta
# ningun token de Vercel ni secreto en este repositorio.

on:
  schedule:
    # Cadencia exacta de 45 minutos repartida en 3 patrones cron.
    # GitHub Actions interpreta el cron en UTC.
    - cron: '0,45 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
    - cron: '15 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Productos a leer (0 = los 54)'
        required: false
        default: '0'
      skip_search:
        description: '1 = omitir la verificacion con el buscador de PCC (mas rapido, ~10 min)'
        required: false
        default: '1'
      trigger_type:
        description: 'manual o automatic: origen de la actualizacion'
        type: choice
        options:
          - manual
          - automatic
        required: false
        default: manual

# Nunca dos scrapings a la vez: el segundo esperaria al primero.
concurrency:
  group: refresh-precios
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    name: Zococity + PCComponentes -> public/data.json
    # 24.04 fijo a proposito: la imagen esta verificada (Chrome 157, xvfb 2:21,
    # Python 3.12). 'ubuntu-latest' cambiara a Ubuntu 26.04 en noviembre 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recuperar la instantanea publicada anterior
        run: cp public/data.json download/zoco-pcc-monitor/data.json

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r download/zoco-pcc-monitor/requirements.txt
          # Chrome y Xvfb ya vienen en la imagen del runner; solo se verifican.
          google-chrome --version
          command -v Xvfb >/dev/null && echo "Xvfb OK"

      - name: Scraping en directo
        env:
          LIMIT: ${{ inputs.limit }}
          SKIP_SEARCH: ${{ inputs.skip_search }}
          TRIGGER_TYPE: ${{ inputs.trigger_type }}
          # En CI el sandbox de Chrome no arranca (nodriver: "Failed to connect
          # to browser"). Con esto se desactiva solo en el runner; en el PC
          # local el sandbox sigue activo.
          ZOCO_NO_SANDBOX: '1'
        run: |
          set -euo pipefail
          cd download/zoco-pcc-monitor
          LIMIT="${LIMIT:-0}"
          SKIP="${SKIP_SEARCH:-1}"
          ARGS=()
          if [ "$SKIP" = "1" ]; then ARGS+=(--skip-search); fi
          if [ "$LIMIT" != "0" ]; then ARGS+=(--limit "$LIMIT"); fi
          echo "argumentos: ${ARGS[*]:-(todos)}"
          # Chrome real headed + Xvfb (lo arranca zoco_fetcher.ensure_display):
          # es lo unico que supera el reto de Cloudflare de PCComponentes.
          python3 pipeline.py "${ARGS[@]}"

      - name: Regenerar el sitio estatico
        run: python3 scripts/build_public.py

      - name: Publicar la instantanea
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios: el sitio publicado sigue vigente."
            exit 0
          fi
          git commit -m "datos: instantanea $(date -u +%FT%TZ) [skip ci]"
          # Otro commit a main puede entrar mientras dura el scraping (por
          # ejemplo, una edición del cron). Reaplica nuestra instantánea sobre
          # la punta actual y vuelve a intentar, conservando el resultado más
          # reciente del scraping en caso de conflicto en data.json.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "No se pudo publicar tras 3 intentos."
              exit 1
            fi
            git fetch origin main
            git rebase -X theirs origin/main
          done
